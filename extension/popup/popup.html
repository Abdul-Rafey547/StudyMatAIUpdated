<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudyMate AI</title>
    <link rel="stylesheet" href="popup.css">
</head>

<body>

    <div class="app">

        <!-- ===== Header ===== -->
        <header class="header">
            <div class="brand">
                <div class="logo">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"
                              fill="white"/>
                    </svg>
                </div>
                <div>
                    <h1>StudyMate AI</h1>
                    <p class="brand-sub">Smart Assignment Assistant</p>
                </div>
            </div>
            <button class="icon-btn settings-btn" id="openSettingsBtn" aria-label="Open Dashboard">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"/>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65
                             1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65
                             1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65
                             1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65
                             1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65
                             1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65
                             1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65
                             1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65
                             1.65 0 0 0-1.51 1z"/>
                </svg>
            </button>
        </header>


        <!-- ===== Connection Status ===== -->
        <div class="status-bar">
            <span class="status-dot connected" id="statusDot"></span>
            <span class="status-text" id="statusText">Connected to Student Portal</span>
        </div>


        <!-- ===== Greeting + Scan CTA ===== -->
        <section class="greeting">
            <p class="overline">WELCOME BACK</p>
            <h2>Hello, Student 👋</h2>
            <p class="greeting-sub">Let AI handle your coursework while you focus on learning.</p>

            <button class="scan-btn" id="scanBtn">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="23 4 23 10 17 10"/>
                    <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
                </svg>
                Scan for Assignments
            </button>
        </section>


        <!-- ===== Stats ===== -->
        <section class="stats">
            <div class="stat-card">
                <span class="stat-icon pending-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <polyline points="12 6 12 12 16 14"/>
                    </svg>
                </span>
                <div>
                    <span class="stat-number" id="statPending">00</span>
                    <span class="stat-label">Pending</span>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon draft-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
                    </svg>
                </span>
                <div>
                    <span class="stat-number" id="statDraft">00</span>
                    <span class="stat-label">In Draft</span>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon done-icon">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
                        <polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                </span>
                <div>
                    <span class="stat-number" id="statSubmitted">00</span>
                    <span class="stat-label">Submitted</span>
                </div>
            </div>
        </section>


        <!-- ===== Task List ===== -->
        <section class="section">
            <div class="section-header">
                <h3>Assignments &amp; Quizzes</h3>
                <button class="view-all" id="viewAllBtn">View all</button>
            </div>

            <div id="popupTaskList">
                <!-- Dynamically loaded via popup.js -->
            </div>
        </section>


        <!-- ===== AI Card ===== -->
        <section class="ai-card" id="aiAgentCard">
            <div class="ai-glow"></div>
            <div class="ai-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
            </div>
            <div class="ai-content">
                <h3 id="aiStatusTitle">AI Agent Active</h3>
                <p id="aiStatusDesc">Ready to assist with coursework</p>
            </div>
            <div class="ai-pulse" id="aiPulse"></div>
        </section>


        <!-- ===== Auto-Submit Toggle ===== -->
        <section class="auto-submit-row">
            <div class="auto-submit-info">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 2L11 13"/>
                    <path d="M22 2L15 22 11 13 2 9l20-7z"/>
                </svg>
                <span>Auto-Submit Mode</span>
            </div>
            <label class="toggle" aria-label="Toggle auto-submit">
                <input type="checkbox" id="autoSubmitToggle">
                <span class="toggle-slider"></span>
            </label>
        </section>


        <!-- ===== Bottom Nav ===== -->
        <nav class="navigation">
            <button class="nav-item active" data-tab="home" aria-label="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <small>Home</small>
            </button>
            <button class="nav-item" data-tab="tasks" aria-label="Tasks">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 11l3 3L22 4"/>
                    <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>
                </svg>
                <small>Tasks</small>
            </button>
            <button class="nav-item" data-tab="agent" aria-label="AI Agent">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
                </svg>
                <small>Agent</small>
            </button>
            <button class="nav-item" data-tab="history" aria-label="History">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"/>
                    <polyline points="12 6 12 12 16 14"/>
                </svg>
                <small>History</small>
            </button>
        </nav>

    </div>

    <script src="popup.js"></script>
</body>

</html>
